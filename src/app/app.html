<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" mode="over" position="start">
    <app-sidenav-menu (navigate)="drawer.close()" />
  </mat-sidenav>
  <mat-sidenav-content>
    <app-header (menuToggle)="drawer.toggle()" />
    <main>
      <app-me />
      @defer (on idle) {
        <section class="sections">
          <app-about-me />
          <app-skills />
          <app-experience />
          <app-projects />
          @if (beyondCodeEnabled) {
            <app-beyond-code />
          }
          <app-education />
        </section>
      } @placeholder (minimum 0.5s) {
        <section style="min-height: 50vh">Loading!</section>
      }
    </main>
    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
