<section class="skills">
  <app-expandable-panel>
    <span header>{{ keys.SKILLS.TITLE | translate }}</span>
    <mat-tab-group (selectedIndexChange)="selectedTab.set($event)">
      <mat-tab [label]="keys.SKILLS.FRONTEND | translate">
        <app-skill-list [source]="frontendSkills()" />
      </mat-tab>

      <mat-tab [label]="keys.SKILLS.STRENGTHS | translate">
        <app-skill-list [source]="platformSkills()" />
      </mat-tab>
      <mat-tab [label]="keys.SKILLS.AI | translate">
        <app-skill-list [source]="aiSkills()" />
      </mat-tab>
      <mat-tab [label]="keys.SKILLS.BACKEND | translate">
        <app-skill-list [source]="backendSkills()" />
      </mat-tab>
    </mat-tab-group>
  </app-expandable-panel>
</section>
