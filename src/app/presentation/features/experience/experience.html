<section class="experience">
  <app-expandable-panel>
    <span header>{{ 'EXPERIENCE.TITLE' | translate }}</span>
    <mat-list>
      @for (exp of experiences(); track exp.company.name) {
        <mat-list-item
          role="button"
          tabindex="0"
          (click)="openDetails(exp)"
          (keydown.enter)="openDetails(exp)"
          (keydown.space)="openDetails(exp)"
        >
          <img
            matListItemIcon
            ngSrc="assets/logos/{{ exp.company.logo }}"
            width="50"
            height="50"
            [alt]="exp.company.name | translate"
          />
          <span matListItemTitle>{{ exp.company.name | translate }}</span>
          <span matListItemLine>{{ exp.role.title | translate }}</span>
        </mat-list-item>
      }
    </mat-list>
  </app-expandable-panel>
</section>
