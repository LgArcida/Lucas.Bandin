<section class="experience">
  <app-expandable-panel>
    <span header>{{ 'EXPERIENCE.TITLE' | translate }}</span>
    <mat-action-list>
      @for (exp of experiences(); track exp.company.name) {
        <button mat-list-item (click)="openDetails(exp)">
          <img
            matListItemAvatar
            ngSrc="assets/logos/{{ exp.company.logo }}"
            width="48"
            height="48"
            [alt]="exp.company.name"
          />
          <span matListItemTitle>{{ exp.company.name }}</span>
          <span matListItemLine>{{ exp.role.title }}</span>
        </button>
      }
    </mat-action-list>
  </app-expandable-panel>
</section>
