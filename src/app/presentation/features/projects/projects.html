<section class="projects">
  <app-expandable-panel>
    <span header>{{ translations.PROJECTS.SUB_TITLE | translate }}</span>
    <mat-list>
      @for (project of projects(); track project.title) {
        <mat-list-item
          role="button"
          tabindex="0"
          (click)="openDetails(project)"
          (keydown.enter)="openDetails(project)"
          (keydown.space)="openDetails(project)"
        >
          <img
            matListItemIcon
            ngSrc="assets/logos/{{ project.image }}"
            width="50"
            height="50"
            [alt]="project.title | translate"
          />

          <span matListItemTitle>{{ project.company | translate }}</span>
          <span matListItemLine>{{ project.role | translate }}</span>
        </mat-list-item>
      }
    </mat-list>
  </app-expandable-panel>
</section>
